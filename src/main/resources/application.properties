# Nombre de la aplicación
spring.application.name=jwt

# Configuración de conexión a PostgreSQL (Hardcoded)
spring.datasource.url=jdbc:postgresql://localhost:5432/springjwt
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JWT (Necesaria para que el código no falle)
# El 'secret' debe ser una cadena larga para cumplir con los requisitos de seguridad
jwt.secret=esta_es_una_clave_secreta_para_desarrollo_local_de_64_caracteres_minimo
# Expiración en milisegundos (ej: 3600000 = 1 hora)
jwt.expiration=3600000